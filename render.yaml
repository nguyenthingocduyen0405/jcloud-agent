services:
  - type: web
    name: jcloud-agent
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.15
      - key: LLM_PROVIDER
        value: auto
      - key: LLM_MODEL
        value: gpt-5-nano
      - key: LLM_API_KEY
        sync: false
      - key: LLM_TIMEOUT_SECONDS
        value: 15
      - key: LLM_MAX_OUTPUT_TOKENS
        value: 500
      - key: LLM_REASONING_EFFORT
        value: minimal
      - key: LLM_FAST_PATH
        value: true
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-31b-it:free
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: 20
      - key: OPENROUTER_MAX_OUTPUT_TOKENS
        value: 500
      - key: OPENROUTER_ATTEMPTS
        value: 2
